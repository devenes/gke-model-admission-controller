<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1060" height="500" rx="16" fill="#0f172a"/>
  <text x="530" y="40" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Zero-Network-I/O Validating Admission Sequence</text>
  <text x="530" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Synchronous Admission Evaluation Against Reconciled Informer Cache &amp; PolicyStore</text>

  <!-- Participant Headers -->
  <rect x="40" y="90" width="140" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="117" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Workload Creator</text>

  <rect x="240" y="90" width="170" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="325" y="117" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">K8s API Server</text>

  <rect x="470" y="90" width="190" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="565" y="117" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Admission Webhook</text>

  <rect x="720" y="90" width="140" height="45" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
  <text x="790" y="117" text-anchor="middle" fill="#fde047" font-size="13" font-weight="700">PolicyStore</text>

  <rect x="890" y="90" width="140" height="45" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="960" y="117" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">Informer Cache</text>

  <!-- Lifelines -->
  <line x1="110" y1="135" x2="110" y2="465" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="325" y1="135" x2="325" y2="465" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="565" y1="135" x2="565" y2="465" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="790" y1="135" x2="790" y2="465" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="960" y1="135" x2="960" y2="465" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Step 1 -->
  <line x1="110" y1="170" x2="325" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="217" y="162" text-anchor="middle" fill="#e2e8f0" font-size="11.5">1. CREATE/UPDATE Pod, Deployment, Job...</text>

  <!-- Step 2 -->
  <line x1="325" y1="210" x2="565" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="202" text-anchor="middle" fill="#e2e8f0" font-size="11.5">2. AdmissionReview (TLS :9443, req.UserInfo)</text>

  <!-- Step 3 -->
  <line x1="565" y1="255" x2="790" y2="255" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="677" y="247" text-anchor="middle" fill="#fde047" font-size="11.5">3. Read active PolicyDigest &amp; Exemptions</text>

  <!-- Step 4 -->
  <line x1="565" y1="305" x2="960" y2="305" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="762" y="297" text-anchor="middle" fill="#86efac" font-size="11.5">4. Lookup ModelArtifact (&amp; BaseModelArtifact if LoRA)</text>

  <!-- Step 5 -->
  <rect x="445" y="330" width="240" height="58" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="565" y="350" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="600">5. Validate Verified, observedGeneration,</text>
  <text x="565" y="366" text-anchor="middle" fill="#dbeafe" font-size="11">policyDigest, validUntil, Image &amp; Config</text>
  <text x="565" y="381" text-anchor="middle" fill="#93c5fd" font-size="10.5">(0 Registry HTTP Requests)</text>

  <!-- Step 6 -->
  <line x1="565" y1="415" x2="325" y2="415" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="407" text-anchor="middle" fill="#e2e8f0" font-size="11.5">6. AdmissionResponse (Allowed + Reason)</text>

  <!-- Step 7 -->
  <line x1="325" y1="450" x2="110" y2="450" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="217" y="442" text-anchor="middle" fill="#e2e8f0" font-size="11.5">7. Persist Workload or Reject (Fail-Closed)</text>
</svg>
