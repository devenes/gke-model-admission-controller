<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1100" height="680" rx="16" fill="#0f172a"/>
  <text x="550" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">GKE Model Admission Controller — End-to-End Architecture</text>
  <text x="550" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Asynchronous OCI v1.1 Supply-Chain Reconciliation + Zero-Network-I/O Kubernetes Admission Enforcement</text>

  <!-- Tier 1: Producer & Qualification Pipeline -->
  <rect x="30" y="90" width="300" height="550" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="120" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">1. Qualification &amp; Signing Pipeline</text>

  <rect x="55" y="145" width="250" height="85" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="180" y="170" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">llm-release-gate</text>
  <text x="180" y="190" text-anchor="middle" fill="#cbd5e1" font-size="11.5">Behavioral Suite &amp; Regression Gate</text>
  <text x="180" y="208" text-anchor="middle" fill="#38bdf8" font-size="11">Native DSSE (evaluation-evidence/v1)</text>

  <line x1="180" y1="230" x2="180" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="270" width="250" height="125" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="180" y="295" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">ai-model-provenance-gate</text>
  <text x="180" y="317" text-anchor="middle" fill="#cbd5e1" font-size="11.5">• bundle-identity/v1 (RFC 8785 JCS)</text>
  <text x="180" y="335" text-anchor="middle" fill="#cbd5e1" font-size="11.5">• OpenSSF Model Signing (OMS v1.0)</text>
  <text x="180" y="353" text-anchor="middle" fill="#cbd5e1" font-size="11.5">• CycloneDX 1.7 AI/ML-BOM</text>
  <text x="180" y="371" text-anchor="middle" fill="#38bdf8" font-size="11">• Release Qualification (5-Point Binding)</text>

  <line x1="180" y1="395" x2="180" y2="430" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="435" width="250" height="80" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="180" y="460" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">modelctl push</text>
  <text x="180" y="482" text-anchor="middle" fill="#cbd5e1" font-size="11.5">Packages OCI v1.1 Subject Manifest</text>
  <text x="180" y="500" text-anchor="middle" fill="#94a3b8" font-size="11">+ 4 Cryptographic Referrer Artifacts</text>

  <rect x="55" y="540" width="250" height="75" rx="8" fill="#172554" stroke="#1d4ed8" stroke-width="1"/>
  <text x="180" y="563" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">3 Isolated Signer Trust Domains</text>
  <text x="180" y="582" text-anchor="middle" fill="#dbeafe" font-size="11">modelSigners | evaluators</text>
  <text x="180" y="599" text-anchor="middle" fill="#dbeafe" font-size="11">releaseAuthorities (Ed25519)</text>

  <!-- Tier 2: Google Artifact Registry -->
  <rect x="370" y="90" width="290" height="550" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="515" y="120" text-anchor="middle" fill="#a855f7" font-size="15" font-weight="700">2. Google Artifact Registry (OCI 1.1)</text>

  <rect x="395" y="145" width="240" height="90" rx="8" fill="#0f172a" stroke="#9333ea" stroke-width="1.5"/>
  <text x="515" y="170" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">OCI Subject Manifest (@sha256)</text>
  <text x="515" y="190" text-anchor="middle" fill="#d8b4fe" font-size="11">config: bundle-manifest.json</text>
  <text x="515" y="208" text-anchor="middle" fill="#cbd5e1" font-size="11">layers: config.json, *.safetensors, tokenizer</text>

  <line x1="305" y1="475" x2="395" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="515" y="262" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">OCI v1.1 Referrers (/v2/.../referrers/sha256)</text>

  <rect x="395" y="278" width="240" height="56" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <text x="515" y="300" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">1. OMS v1.0 Signature Referrer</text>
  <text x="515" y="319" text-anchor="middle" fill="#94a3b8" font-size="10.5">vnd.openssf.model-signing.signature.v1+json</text>

  <rect x="395" y="348" width="240" height="56" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <text x="515" y="370" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">2. CycloneDX 1.7 AI/ML-BOM Referrer</text>
  <text x="515" y="389" text-anchor="middle" fill="#94a3b8" font-size="10.5">application/vnd.cyclonedx+json</text>

  <rect x="395" y="418" width="240" height="56" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <text x="515" y="440" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">3. Native Evaluation Evidence Referrer</text>
  <text x="515" y="459" text-anchor="middle" fill="#94a3b8" font-size="10.5">vnd.devenes.evaluation.attestation.v1+json</text>

  <rect x="395" y="488" width="240" height="56" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <text x="515" y="510" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">4. Release Qualification Referrer</text>
  <text x="515" y="529" text-anchor="middle" fill="#94a3b8" font-size="10.5">vnd.devenes.release-qualification.v1+json</text>

  <rect x="395" y="560" width="240" height="55" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="515" y="582" text-anchor="middle" fill="#c7d2fe" font-size="11.5" font-weight="700">Zero Model Weight Downloads</text>
  <text x="515" y="600" text-anchor="middle" fill="#a5b4fc" font-size="10.5">Descriptors &amp; metadata only (&lt;= 16 MiB)</text>

  <!-- Tier 3: GKE Cluster -->
  <rect x="700" y="90" width="370" height="550" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="885" y="120" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="700">3. GKE Standard Cluster (trust.gke.dev)</text>

  <rect x="725" y="145" width="320" height="100" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="885" y="168" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">ModelArtifact Controller &amp; Engine</text>
  <text x="885" y="188" text-anchor="middle" fill="#cbd5e1" font-size="11">7-Stage Verification via pkg/verify (In-Memory)</text>
  <text x="885" y="206" text-anchor="middle" fill="#cbd5e1" font-size="11">Workload Identity Auth (roles/artifactregistry.reader)</text>
  <text x="885" y="224" text-anchor="middle" fill="#34d399" font-size="11">Updates ModelArtifact.status (Verified + validUntil)</text>

  <line x1="635" y1="195" x2="725" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="725" y="265" width="320" height="75" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
  <text x="885" y="288" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">ClusterModelTrustPolicy &amp; PolicyStore</text>
  <text x="885" y="308" text-anchor="middle" fill="#fde047" font-size="11">Canonical RFC 8785 JCS policyDigest</text>
  <text x="885" y="325" text-anchor="middle" fill="#cbd5e1" font-size="11">Watches Secret/model-trust-keys &amp; triggers re-verify</text>

  <line x1="885" y1="245" x2="885" y2="365" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="885" y1="340" x2="885" y2="365" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="725" y="370" width="320" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="885" y="393" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">Validating Admission Webhook (:9443)</text>
  <text x="885" y="413" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Zero Network / Registry I/O on Admission Path</text>
  <text x="885" y="431" text-anchor="middle" fill="#cbd5e1" font-size="11">Checks Verified, policyDigest, validUntil, LoRA, Image</text>
  <text x="885" y="448" text-anchor="middle" fill="#94a3b8" font-size="10.5">Pod | Deployment | StatefulSet | DaemonSet | Job | CronJob</text>

  <rect x="725" y="485" width="320" height="50" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="885" y="508" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Kubernetes API Server (AdmissionReview)</text>
  <text x="885" y="525" text-anchor="middle" fill="#94a3b8" font-size="11">failurePolicy: Fail | trust.gke.dev/enforce: "true"</text>

  <line x1="885" y1="485" x2="885" y2="460" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ALLOW / DENY boxes -->
  <rect x="725" y="565" width="150" height="50" rx="8" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="590" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">ALLOW</text>
  <text x="800" y="606" text-anchor="middle" fill="#bbf7d0" font-size="10.5">Verified Supply Chain</text>

  <rect x="895" y="565" width="150" height="50" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="970" y="590" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700">DENY</text>
  <text x="970" y="606" text-anchor="middle" fill="#fecaca" font-size="10.5">Fail-Closed Rejection</text>

  <line x1="830" y1="535" x2="800" y2="565" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-allow)"/>
  <line x1="940" y1="535" x2="970" y2="565" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-deny)"/>
</svg>
