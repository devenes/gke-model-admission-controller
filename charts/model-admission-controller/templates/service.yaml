apiVersion: v1
kind: Service
metadata:
  name: gke-model-admission-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gke-model-admission-controller
spec:
  selector:
    app.kubernetes.io/name: gke-model-admission-controller
  ports:
    - name: https-webhook
      port: 443
      targetPort: {{ .Values.webhook.port }}
      protocol: TCP
    - name: http-metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
