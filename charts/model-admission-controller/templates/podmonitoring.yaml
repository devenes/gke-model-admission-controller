{{- if .Values.monitoring.podMonitoring.enabled }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: gke-model-admission-controller
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-model-admission-controller
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.podMonitoring.interval }}
      path: /metrics
{{- end }}
