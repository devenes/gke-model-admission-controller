apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutable-tag-vllm-serving
  namespace: ai-serving
  annotations:
    trust.gke.dev/model-artifact: "gemma-2b-it"
    trust.gke.dev/serving-config-digest: "sha256:c1fb3dd4b72e479221aa59c0b5ff33d4eae61a14c2de7ffdd3a6cf57054f34b8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mutable-tag-vllm
      app.kubernetes.io/component: inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mutable-tag-vllm
        app.kubernetes.io/component: inference
      annotations:
        trust.gke.dev/model-artifact: "gemma-2b-it"
        trust.gke.dev/serving-config-digest: "sha256:c1fb3dd4b72e479221aa59c0b5ff33d4eae61a14c2de7ffdd3a6cf57054f34b8"
    spec:
      containers:
        - name: vllm
          image: us-west4-docker.pkg.dev/PROJECT_ID/models/vllm-runtime:latest
          args:
            - "--model=/models/gemma-2b-it"
